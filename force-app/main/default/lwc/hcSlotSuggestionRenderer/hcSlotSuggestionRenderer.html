<template>
    <div class="hc-slot-wrap">
        <!-- 1. Selection Confirmed State: Shows after the user clicks a slot -->
        <template if:true={isSelection}>
            <div class="hc-slot-confirmed">
                <span class="hc-slot-label">Selected: <strong>{value}</strong></span>
            </div>
        </template>

        <!-- 2. Interactive State: Shows the list of available slots -->
        <template if:true={payloadObj}>
            <div class="hc-slot-header">
                <span class="hc-slot-title">{facilityLabel}</span>
                <template if:true={dateLabel}>
                    <span class="hc-slot-date">{dateLabel}</span>
                </template>
            </div>
            <template if:true={hasSlots}>
                <ul class="hc-slot-list">
                    <template for:each={slotRows} for:item="row">
                        <li
                            key={row.key}
                            class="hc-slot-item"
                            role="button"
                            tabindex="0"
                            title="Click to copy this time"
                            data-copytext={row.copyText}
                            onclick={handleSlotCopy}
                            onkeydown={handleSlotKeydown}
                        >
                            <span class="hc-slot-label">{row.label}</span>
                            <span class="hc-slot-copy-hint">Copy</span>
                        </li>
                    </template>
                </ul>
            </template>
            <template if:false={hasSlots}>
                <p class="hc-slot-empty">{emptyMessage}</p>
            </template>
        </template>

        <!-- 3. Error State: no usable payload and not a string selection -->
        <template if:false={payloadObj}>
            <template if:false={isSelection}>
                <p class="hc-slot-empty">Unable to display slots.</p>
            </template>
        </template>
    </div>
</template>
